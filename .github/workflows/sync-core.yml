name: Core and Companion checks
on:
  push:
    branches: [main, 'codex/**', dev/il2cpp-migration]
  pull_request:
jobs:
  regressions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/VRoidXYTool.SyncCore.Tests -c Release -p:NuGetAudit=false
      - run: dotnet run --project tests/VRoidXYTool.CompanionCore.Tests -c Release -p:NuGetAudit=false
      - run: dotnet run --project tests/VRoidXYTool.Performance.Tests -c Release -p:NuGetAudit=false
      - run: dotnet build src/VRoidXYTool.Companion -c Release -p:NuGetAudit=false
      - run: dotnet run --project tests/VRoidXYTool.Compatibility.Tests -c Release -p:NuGetAudit=false
      - run: dotnet build tests/VRoidXYTool.Launcher.Tests -c Release -p:NuGetAudit=false
      - run: dotnet build tests/VRoidXYTool.Setup.Tests -c Release -p:NuGetAudit=false
      - name: Compile launcher with a nonshipping fixture payload
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'compile-only-payload.zip'
          Compress-Archive -LiteralPath README.md -DestinationPath $fixture
          dotnet build src/VRoidXYTool.Launcher -c Release "-p:PayloadPath=$fixture" -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
